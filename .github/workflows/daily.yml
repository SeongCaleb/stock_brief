name: Stock Brief Daily

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 KST (UTC 22:00)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write            # seen.json 커밋 백을 위해 필요

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PASS: ${{ secrets.NAVER_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}  # 미설정 시 claude-sonnet-5
          MAX_ARTICLES: ${{ vars.MAX_ARTICLES }}    # 미설정 시 5
        run: python main.py

      - name: Persist seen.json
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "chore: update seen.json [skip ci]"
            git push
          else
            echo "seen.json 변경 없음"
          fi
