name: Stock Brief v3 PR Tests
on:
  pull_request:
    paths:
      - 'main_v3.py'
      - 'v3_research.py'
      - 'v3_market_data.py'
      - 'v4_discovery.py'
      - 'v4_email.py'
      - 'v4_community.py'
      - 'v4_saveticker.py'
      - 'v4_deep_research.py'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile main_v3.py v3_research.py v3_market_data.py v4_discovery.py v4_email.py v4_community.py v4_saveticker.py v4_deep_research.py
