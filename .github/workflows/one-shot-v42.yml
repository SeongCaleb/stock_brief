name: Stock Brief V4.2 One-Time Check and Revision
on:
  push:
    paths:
      - ".github/trigger-v42-preview.txt"
      - ".github/trigger-v42-send.txt"
permissions:
  contents: write
concurrency:
  group: stock-brief-daily
  cancel-in-progress: false
jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run preview or explicitly requested revised email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PASS: ${{ secrets.NAVER_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          MAX_ARTICLES: ${{ vars.MAX_ARTICLES }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          STOCK_WATCHLIST: ${{ vars.STOCK_WATCHLIST }}
          DISCOVERY_LIMIT: "18"
        shell: bash
        run: |
          set -euo pipefail
          if git show --format= --name-only HEAD | grep -qx '.github/trigger-v42-send.txt'; then
            echo "Running user-requested V4.2 revised email (one per KST day)"
            python main_v3.py --send-revision
            echo "SENT_REVISION=true" >> "$GITHUB_ENV"
          else
            echo "Running V4.2 preview, no email"
            python main_v3.py --preview
          fi
      - name: Archive HTML and source data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v42-${{ github.run_id }}
          path: |
            reports/latest.html
            reports/market_snapshot.json
            reports/community_sources.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Persist state only following a successful send
        if: success() && env.SENT_REVISION == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json v3_delivery_state.json v4_thesis_history.json v4_community_seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record v4.2 revised briefing delivery [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
